<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}</style>
<title>思考能力强度图</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@900&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: left column is the poster being edited (dial over heatmap, in export order); right column is the settings rail. Stacks on phones. */
:root {
  --bg: #e9ecf1;
  --panel: #ffffff;
  --face: #ffffff;
  --ink: #171a21;
  --muted: #5f6676;
  --line: #d3d8e0;
  --empty: #e6e9ee;
  --accent: #2f43cf;
  --accent-ink: #ffffff;
  --f-display: "Noto Serif SC", "Songti SC", "SimSun", serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1014; --panel: #171a20; --face: #1b1f26; --ink: #e8eaef; --muted: #8d94a4;
    --line: #2d323c; --empty: #272b34; --accent: #8191ff; --accent-ink: #0e1014; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1014; --panel: #171a20; --face: #1b1f26; --ink: #e8eaef; --muted: #8d94a4;
  --line: #2d323c; --empty: #272b34; --accent: #8191ff; --accent-ink: #0e1014; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 24px 48px; }
.app { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 24px; align-items: start; }
@media (max-width: 900px) { .app { grid-template-columns: minmax(0, 1fr); } }

.poster { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.ptitle { display: flex; flex-direction: column; gap: 2px; text-align: center; }
.ptitle h1 { margin: 0; font-family: var(--f-display); font-weight: 900; font-size: clamp(24px, 4vw, 34px); letter-spacing: .04em; text-wrap: balance; }
.ptitle p { margin: 0; color: var(--muted); }

.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.brush { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--face); color: var(--ink); font: inherit; cursor: pointer; }
.brush .sw { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgba(0,0,0,.12); }
.brush .key { font-family: var(--f-mono); font-size: 11px; color: var(--muted); }
.brush[aria-pressed="true"] { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.brush.erase .sw { background: repeating-linear-gradient(45deg, var(--empty) 0 3px, var(--face) 3px 6px); }

.days { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.days button { font: inherit; font-size: 13px; padding: 4px 10px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.days button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.days .sep { width: 1px; align-self: stretch; background: var(--line); margin: 2px 4px; }
.days .lbl { color: var(--muted); font-size: 12px; align-self: center; margin-right: 4px; }

.dialbox { width: 100%; max-width: 540px; margin: 0 auto; aspect-ratio: 1; }
.dialbox canvas, .heatbox canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: crosshair; }
.readout { text-align: center; font-family: var(--f-mono); font-size: 12px; color: var(--muted); min-height: 18px; font-variant-numeric: tabular-nums; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; justify-content: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.legend b { font-weight: 500; }
.legend em { font-style: normal; color: var(--muted); font-family: var(--f-mono); font-size: 12px; }

.sechead { display: flex; justify-content: space-between; align-items: baseline; border-top: 1px solid var(--line); padding-top: 14px; }
.sechead h2 { margin: 0; font-size: 13px; letter-spacing: .12em; color: var(--muted); font-weight: 500; }
.sechead small { color: var(--muted); font-size: 12px; }
.heatbox { width: 100%; }

.rail { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card h3 { margin: 0; font-size: 12px; letter-spacing: .14em; color: var(--muted); font-weight: 500; }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
input[type="text"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--face); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; width: 100%; min-width: 0; }
input[type="text"]:focus-visible, button:focus-visible, input[type="color"]:focus-visible, input[type="checkbox"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.srow { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
input[type="color"] { width: 36px; height: 34px; padding: 2px; border: 1px solid var(--line); border-radius: 8px; background: var(--face); cursor: pointer; }
.iconbtn { font: inherit; font-size: 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; padding: 6px 8px; cursor: pointer; }
.iconbtn:hover { color: var(--ink); border-color: var(--ink); }
.btn { font: inherit; font-size: 13px; border: 1px solid var(--line); background: var(--face); color: var(--ink); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; font-size: 15px; padding: 11px 14px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.seg { display: flex; gap: 4px; }
.seg button { flex: 1; font: inherit; font-size: 13px; padding: 6px; border-radius: 6px; border: 1px solid var(--line); background: transparent; color: var(--muted); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.hint { font-size: 12px; color: var(--muted); margin: 0; }
.note { font-size: 12px; color: var(--muted); margin: 0; }
.note b { color: var(--ink); font-weight: 500; }

.modal { position: fixed; inset: 0; background: rgba(10,12,16,.6); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal .box { background: var(--panel); border-radius: 14px; padding: 16px; max-width: 520px; width: 100%; max-height: 100%; display: flex; flex-direction: column; gap: 12px; }
.modal img { max-height: 62vh; object-fit: contain; border-radius: 8px; border: 1px solid var(--line); align-self: center; }
.modal .msg { font-size: 13px; color: var(--muted); margin: 0; }
@media (prefers-reduced-motion: no-preference) { .brush, .days button, .btn { transition: border-color .15s, background .15s; } }
</style>

</head>
<body>
<div class="wrap">
  <div class="app">
    <section class="poster" aria-label="编辑区">
      <div class="ptitle" id="ptitle">
        <h1 id="titleView">思考能力强度图</h1>
        <p id="subView"></p>
      </div>

      <div class="toolbar" id="palette" role="toolbar" aria-label="画笔"></div>
      <div class="days" id="days" role="group" aria-label="编辑对象"></div>

      <div class="dialbox" id="dialbox"><canvas id="dial" aria-label="24 小时表盘，拖动涂色"></canvas></div>
      <div class="readout" id="readout">在表盘或热力图上按住拖动即可涂色</div>
      <div class="legend" id="legend"></div>

      <div id="heatSection">
        <div class="sechead"><h2>一周热力图</h2><small>点击左侧星期可单独编辑那一天</small></div>
        <div class="heatbox" id="heatbox"><canvas id="heat" aria-label="一周热力图，拖动涂色"></canvas></div>
      </div>
    </section>

    <aside class="rail">
      <div class="card">
        <h3>文字</h3>
        <label class="field">标题<input type="text" id="inTitle" maxlength="30"></label>
        <label class="field">副标题 / 署名<input type="text" id="inSub" maxlength="40" placeholder="例如：@你的名字 · 2026 秋"></label>
      </div>

      <div class="card">
        <h3>状态与颜色</h3>
        <div id="stateList" style="display:flex;flex-direction:column;gap:8px"></div>
        <div class="btnrow"><button class="btn" id="addState" type="button">＋ 添加状态</button></div>
      </div>

      <div class="card">
        <h3>表盘配色</h3>
        <div id="dialColors" style="display:flex;flex-direction:column;gap:8px"></div>
        <p class="hint">刻度和数字默认按底色自动取黑或白；自定义后统一使用所选颜色。</p>
      </div>

      <div class="card">
        <h3>显示</h3>
        <label class="check"><input type="checkbox" id="optTitle">显示标题</label>
        <label class="check"><input type="checkbox" id="optArc">在表盘上写状态名</label>
        <label class="check"><input type="checkbox" id="optNum">显示刻度数字</label>
        <label class="check"><input type="checkbox" id="optHours">图例显示日均时长</label>
        <label class="check"><input type="checkbox" id="optHeat">显示热力图</label>
      </div>

      <div class="card">
        <h3>编辑</h3>
        <div class="btnrow">
          <button class="btn" id="undo" type="button">撤销 <span class="key">Ctrl+Z</span></button>
          <button class="btn" id="clearScope" type="button">清空当前</button>
          <button class="btn" id="copyAll" type="button" hidden>复制到全天</button>
          <button class="btn" id="sample" type="button">载入示例</button>
        </div>
        <p class="note" id="sampleNote">当前是<b>示例数据</b>，涂抹后即为你的作息。</p>
        <p class="hint">快捷键：数字键切换画笔，E 为橡皮。选「全天」「工作日」或「休息日」时，表盘每格显示这几天里最常见的状态，涂抹会同时改动这几天。</p>
      </div>

      <div class="card">
        <h3>导出</h3>
        <div class="seg" role="group" aria-label="导出底色">
          <button type="button" id="bgLight" aria-pressed="true">浅色底</button>
          <button type="button" id="bgDark" aria-pressed="false">深色底</button>
        </div>
        <button class="btn primary" id="export" type="button">导出整张图片（竖版 PNG）</button>
        <p class="hint">导出内容：标题、表盘、图例、热力图，宽 2160 像素。</p>
      </div>
    </aside>
  </div>
</div>

<div class="modal" id="modal" hidden>
  <div class="box" role="dialog" aria-modal="true" aria-label="导出结果">
    <img id="outImg" alt="导出的思考能力强度图">
    <p class="msg" id="outMsg"></p>
    <div class="btnrow">
      <button class="btn primary" id="saveBtn" type="button">保存图片</button>
      <button class="btn" id="closeModal" type="button">关闭</button>
    </div>
  </div>
</div>

<script>
(() => {
const SLOTS = 48, STEP = Math.PI * 2 / SLOTS;
const DAYS = ['周一', '周二', '周三', '周四', '周五', '周六', '周日'];
const PALETTE = ['#e5484d', '#f2c230', '#3fa66b', '#3b82f6', '#8b5cf6', '#f97316', '#14b8a6', '#ec4899', '#64748b'];
const FONT_BODY = '"Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif';
const FONT_DISP = '"Noto Serif SC", "Songti SC", "SimSun", serif';
const FONT_MONO = '"JetBrains Mono", Consolas, monospace';
const STORE = 'thinking-clock-v2';

function sampleGrid() {
  const g = [];
  const span = (row, a, b, id) => { for (let s = a * 2; s < b * 2; s++) row[s % SLOTS] = id; };
  for (let d = 0; d < 7; d++) {
    const r = new Array(SLOTS).fill(null);
    if (d < 5) {
      span(r, 0, 7, 'c'); span(r, 7, 9, 'b'); span(r, 9, 12, 'a'); span(r, 12, 13.5, 'b');
      span(r, 13.5, 18, 'a'); span(r, 18, 19.5, 'b'); span(r, 19.5, 23, 'a'); span(r, 23, 24, 'c');
      if (d === 4) { span(r, 21, 24, 'b'); }
    } else {
      span(r, 0, 1.5, 'a'); span(r, 1.5, 10, 'c'); span(r, 10, 12, 'b'); span(r, 12, 18, 'a');
      span(r, 18, 21, 'b'); span(r, 21, 24, 'a');
    }
    g.push(r);
  }
  return g;
}
function defaults() {
  return {
    title: '思考能力强度图', subtitle: '',
    states: [
      { id: 'a', name: '快速思考', color: '#3fa66b' },
      { id: 'b', name: '无法思考', color: '#f2c230' },
      { id: 'c', name: '查无此人', color: '#e5484d' },
    ],
    grid: sampleGrid(), isSample: true,
    opts: { title: true, arc: true, num: true, hours: true, heat: true },
    exportBg: 'light',
    dialColors: { bezel: null, tick: null, num: null, hub: null },
  };
}

let S = defaults();
try {
  const raw = localStorage.getItem(STORE);
  if (raw) { const p = JSON.parse(raw); if (p && p.grid && p.states) S = Object.assign(defaults(), p, { opts: Object.assign(defaults().opts, p.opts), dialColors: Object.assign(defaults().dialColors, p.dialColors) }); }
} catch (e) {}
let day = -1;           // -1 全天, -2 工作日, -3 休息日, 0–6 单日
const scopeDays = d => d >= 0 ? [d] : d === -2 ? [0, 1, 2, 3, 4] : d === -3 ? [5, 6] : [0, 1, 2, 3, 4, 5, 6];
const scopeName = d => d >= 0 ? DAYS[d] : d === -2 ? '工作日' : d === -3 ? '休息日' : '全天';
let brush = S.states[0] ? S.states[0].id : 'erase';
const undoStack = [];

let saveTimer;
function persist() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { try { localStorage.setItem(STORE, JSON.stringify(S)); } catch (e) {} }, 250);
}
function pushUndo() {
  undoStack.push(JSON.stringify({ grid: S.grid, states: S.states, isSample: S.isSample }));
  if (undoStack.length > 60) undoStack.shift();
}
function undo() {
  const u = undoStack.pop(); if (!u) return;
  const p = JSON.parse(u); S.grid = p.grid; S.states = p.states; S.isSample = p.isSample;
  if (brush !== 'erase' && !stateById(brush)) brush = S.states[0] ? S.states[0].id : 'erase';
  renderAll(true);
}

const $ = id => document.getElementById(id);
const stateById = id => S.states.find(s => s.id === id);
const colorOf = id => { const s = stateById(id); return s ? s.color : null; };
const pad2 = n => String(n).padStart(2, '0');
const fmt = slot => { const m = (slot % SLOTS) * 30; return pad2(Math.floor(m / 60)) + ':' + pad2(m % 60); };
function textOn(hex) {
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) / 255 > 0.6 ? '#1a1d24' : '#ffffff';
}

/* ---------- data views ---------- */
function slotsFor(d) {
  const days = scopeDays(d);
  if (days.length === 1) return S.grid[days[0]];
  const out = [];
  for (let s = 0; s < SLOTS; s++) {
    const cnt = new Map();
    for (const i of days) { const v = S.grid[i][s]; cnt.set(v, (cnt.get(v) || 0) + 1); }
    let best = null, bc = -1;
    for (const st of S.states) { const c = cnt.get(st.id) || 0; if (c > bc) { bc = c; best = st.id; } }
    if ((cnt.get(null) || 0) > bc) best = null;
    out.push(best);
  }
  return out;
}
function hoursPerDay(d) {
  const res = {};
  for (const st of S.states) res[st.id] = 0;
  const rows = scopeDays(d).map(i => S.grid[i]);
  for (const r of rows) for (const v of r) if (v && res[v] != null) res[v] += 0.5;
  for (const k in res) res[k] /= rows.length;
  return res;
}
const fmtH = h => (Math.round(h * 10) / 10).toString().replace(/\.0$/, '') + ' h';

/* ---------- theme ---------- */
function screenTheme() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  return { bg: v('--panel'), face: v('--face'), ink: v('--ink'), muted: v('--muted'), line: v('--line'), empty: v('--empty'), accent: v('--accent') };
}
const EXPORT_THEMES = {
  light: { bg: '#f3f4f7', face: '#ffffff', ink: '#171a21', muted: '#646b7a', line: '#d3d8e0', empty: '#e7e9ee', accent: '#2f43cf' },
  dark:  { bg: '#101217', face: '#1a1d24', ink: '#eceef2', muted: '#8d94a4', line: '#30353f', empty: '#272b34', accent: '#8191ff' },
};

/* ---------- dial drawing ---------- */
function drawArcText(ctx, text, cx, cy, r, mid, px, span, color) {
  const chars = [...text]; if (!chars.length) return;
  let f = px, ca, total;
  for (;;) { ca = f * 1.1 / r; total = ca * chars.length; if (total <= span * 0.9 || f < px * 0.7) break; f -= px * 0.05; }
  if (total > span * 0.92) return;
  ctx.save();
  ctx.fillStyle = color; ctx.font = `700 ${f}px ${FONT_BODY}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const bottom = Math.sin(mid) > 0.2;
  chars.forEach((ch, i) => {
    const a = bottom ? mid + total / 2 - ca / 2 - i * ca : mid - total / 2 + ca / 2 + i * ca;
    ctx.save();
    ctx.translate(cx + r * Math.cos(a), cy + r * Math.sin(a));
    ctx.rotate(bottom ? a - Math.PI / 2 : a + Math.PI / 2);
    ctx.fillText(ch, 0, 1);
    ctx.restore();
  });
  ctx.restore();
}
function runs(slots) {
  if (slots.every(v => v === slots[0])) return slots[0] ? [{ id: slots[0], start: 0, n: SLOTS }] : [];
  let k = 0; while (slots[k] === slots[(k - 1 + SLOTS) % SLOTS]) k++;
  const out = []; let cur = null;
  for (let i = 0; i < SLOTS; i++) {
    const s = (k + i) % SLOTS, v = slots[s];
    if (cur && cur.id === v) cur.n++; else { cur = { id: v, start: s, n: 1 }; out.push(cur); }
  }
  return out.filter(r => r.id);
}
function drawDial(ctx, cx, cy, R, T, slots, label, opts) {
  // Bezel (边框) outside; colour fills the whole face up to it; ticks sit on the outer edge, hour numbers just inside them.
  const k = R / 200, rFace = R * 0.955;
  const ang = s => -Math.PI / 2 + s * STEP;
  const DC = S.dialColors || {};
  const inkFor = id => { const c = colorOf(id); return c ? textOn(c) : T.ink; };
  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.fillStyle = DC.bezel || T.ink; ctx.fill();
  ctx.beginPath(); ctx.arc(cx, cy, rFace, 0, Math.PI * 2); ctx.fillStyle = T.empty; ctx.fill();
  for (let s = 0; s < SLOTS; s++) {
    const a = ang(s);
    ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(cx + rFace * Math.cos(a), cy + rFace * Math.sin(a));
    ctx.strokeStyle = T.face; ctx.lineWidth = Math.max(1, (s % 2 === 0 ? 1.6 : 0.8) * k); ctx.stroke();
  }
  // each run of the same state is one continuous sector reaching the bezel
  const rs = runs(slots);
  for (const run of rs) {
    ctx.beginPath(); ctx.moveTo(cx, cy);
    if (run.n >= SLOTS) ctx.arc(cx, cy, rFace + 0.5, 0, Math.PI * 2);
    else ctx.arc(cx, cy, rFace + 0.5, ang(run.start), ang(run.start + run.n));
    ctx.closePath();
    const c = colorOf(run.id); ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 0.6; ctx.stroke();
  }
  // re-draw bezel ring on top so sector edges stay clean
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2); ctx.arc(cx, cy, rFace, 0, Math.PI * 2, true);
  ctx.fillStyle = DC.bezel || T.ink; ctx.fill('evenodd');
  // ticks on the outermost edge
  const tickLen = s => (s % 12 === 0 ? 0.075 : s % 2 === 0 ? 0.05 : 0.026) * R;
  for (let s = 0; s < SLOTS; s++) {
    const a = ang(s), r0 = rFace - tickLen(s);
    ctx.beginPath();
    ctx.moveTo(cx + r0 * Math.cos(a), cy + r0 * Math.sin(a));
    ctx.lineTo(cx + rFace * Math.cos(a), cy + rFace * Math.sin(a));
    ctx.strokeStyle = DC.tick || inkFor(slots[s]); ctx.lineWidth = (s % 12 === 0 ? 3 : s % 2 === 0 ? 1.8 : 1) * k; ctx.lineCap = 'butt'; ctx.stroke();
  }
  // 24 hour numbers right inside the ticks
  if (opts.num) {
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (let h = 0; h < 24; h++) {
      const s = h * 2, a = ang(s), major = h % 6 === 0;
      const fs = (major ? 15 : 12) * k;

  if (!lastBlob) return;
  if (downloadsApi === undefined) await Promise.race([dlReady, new Promise(r => setTimeout(r, 1500))]);
  if (downloadsApi) {
    try { await downloadsApi.save({ filename: fileName(), data: lastBlob }); $('outMsg').textContent = '已保存。'; }
    catch (e) { $('outMsg').textContent = e && e.code === 'declined' ? '已取消保存。可以再点一次，或长按 / 右键图片另存。' : '这里无法直接保存，请右键或长按图片另存为。'; }
    return;
  }
  const a = document.createElement('a'); a.href = lastUrl; a.download = fileName(); document.body.append(a); a.click(); a.remove();
  $('outMsg').textContent = '如果没有开始下载，请右键或长按图片另存为。';
};
$('closeModal').onclick = () => { $('modal').hidden = true; };
$('modal').addEventListener('click', e => { if (e.target === $('modal')) $('modal').hidden = true; });

/* ---------- boot ---------- */
new ResizeObserver(() => { renderDial(); renderHeat(); }).observe($('dialbox'));
new ResizeObserver(() => renderHeat()).observe($('heatbox'));
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { renderDial(); renderHeat(); });
new MutationObserver(() => { renderDial(); renderHeat(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
if (document.fonts) document.fonts.ready.then(() => { renderDial(); renderHeat(); });
renderAll(true);
})();
</script>
